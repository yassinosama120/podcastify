<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s|0);const h=s/3600|0,m=(s%3600)/60|0;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};
const P={down:'<path d="M6 9l6 6 6-6"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',vol:'<path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',bm:'<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',ok:'<path d="M20 6L9 17l-5-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',heart:'<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',prev:'<path d="M19 20L9 12l10-8v16zM5 19V5"/>',next:'<path d="M5 4l10 8-10 8V4zM19 5v14"/>',play:'<polygon points="7 4 20 12 7 20 7 4" fill="currentColor"/>',pause:'<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>',ccw:'<path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>',cw:'<path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>',head:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>',film:'<rect x="2" y="2" width="20" height="20" rx="3"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>',globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',tv:'<rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/>',sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>'};
function ic(n,s=22,f){return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`}
const skipIc=d=>`<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[d<0?'ccw':'cw']}<text x="12" y="15.2" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">${D.set.skip}</text></svg>`;
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return h%360};
function icons(){$$('[data-a=close]').forEach(b=>b.innerHTML=ic('down',26));$$('[data-a=addpl]').forEach(b=>b.innerHTML=ic('plus',22));$$('[data-a=back]').forEach(b=>b.innerHTML=skipIc(-1));$$('[data-a=fwd]').forEach(b=>b.innerHTML=skipIc(1));$$('[data-a=ps]').forEach(b=>b.innerHTML=ic('prev',24));$$('[data-a=ns]').forEach(b=>b.innerHTML=ic('next',24));$('#pp').innerHTML=ic(M.paused?'play':'pause',28,true);if(cur)pf();mini()}
const DEF={theme:'auto',ac:'#4f46e5',skip:10,speed:1,cap:20,lyr:22,pause:true,rew:2,capm:'de',lvl:'B1',peek:true,keys:{},models:{},prim:'gemini',fb:true};
let D={lib:[],pl:{},fav:{},pos:{},rate:{},tr:{},tl:{},vocab:[],set:{}};
try{Object.assign(D,JSON.parse(localStorage.getItem('pcfy')||'{}'))}catch(e){}
D.set={...DEF,...D.set};
const save=()=>{try{localStorage.setItem('pcfy',JSON.stringify(D))}catch(e){toast('Storage is full: export a backup in Settings')}};

  if(!phrase)wview(txt,await ai(`You are a German tutor for an English-speaking learner at level ${lv}. Sentence: "${ctx}". Tapped word: "${txt}". Reply ONLY with JSON (use null where not applicable, keep German explanations simple, at about level ${lv}): {"lemma":"dictionary form","pos":"noun|verb|adjective|adverb|preposition|conjunction|pronoun|particle","article":"der|die|das|null","plural":null,"genitive":null,"ipa":"","cefr":"A1-C2 level of this word","register":"neutral|formal|colloquial|vulgar","en":["main English meaning first","other meanings"],"sense_en":"meaning in THIS sentence","sense_de":"same in simple German","sentence_en":"natural English translation of the whole sentence","def_de":"clear German definition","explain_en":"2-3 sentence English explanation with nuance","synonyms":[{"de":"","en":""}],"antonyms":[{"de":"","en":""}],"family":[{"de":"related words of the same family","en":""}],"grammar":{"only the applicable keys such as Infinitiv, Praesens er/sie/es, Praeteritum, Partizip II, Hilfsverb, Trennbar, Reflexiv, Kasus, Komparativ, Superlativ":"value"},"compound":"split like Hand + Schuh, or null","collocations":[{"de":"common phrase with the word","en":""}],"examples":[{"de":"","en":""},{"de":"","en":""},{"de":"","en":""}],"tip":"short memory tip or common learner mistake"}`),ctx);
  else pview(txt,await ai(`You are a German tutor for an English-speaking learner at level ${lv}. Sentence: "${ctx}". Selected phrase: "${txt}". Reply ONLY with JSON (null where not applicable, simple German): {"en":"natural English translation","literal":"word-by-word gloss","def_de":"simple German explanation","explain_en":"English explanation with nuance","idiom":"idiom meaning or null","grammar":"short grammar note (tense, clause type, word order)","register":"neutral|formal|colloquial","key":[{"de":"important word","en":"meaning"}]}`),ctx);
 }catch(e){await dictView(txt,ctx)}}
function wtap(el){
 const p=el.parentElement,ws=[...p.querySelectorAll('.w')];
 if(pm){if(!anc||anc.p!==p){anc={p,i:ws.indexOf(el)};el.classList.add('sel');return}
  const a=Math.min(anc.i,ws.indexOf(el)),b=Math.max(anc.i,ws.indexOf(el));ws.slice(a,b+1).forEach(x=>x.classList.add('sel'));look(ws.slice(a,b+1).map(x=>clean(x.textContent)).join(' '),p.textContent,true);return}
 el.classList.add('sel');look(clean(el.textContent),p.textContent,false)}
async function trall(){const c=D.tr[cur.id];if(!c)return;$('#drb').innerHTML='<p class="mut">Translating…</p>';try{const out=[];for(let i=0;i<c.length;i+=40){const part=c.slice(i,i+40).map(x=>x.t);const r=await ai(`Translate these German subtitle lines into natural English. Keep order and count. Reply ONLY with a JSON array of ${part.length} strings.\n`+JSON.stringify(part));out.push(...r)}D.tl[cur.id]=out;save();drw()}catch(e){$('#drb').innerHTML='<p class="mut">Translation unavailable or declined.</p><button data-a="trall">Retry</button>'}}
/* ---------- vocabulary (SM-2 lite) ---------- */
function review(){const due=D.vocab.filter(v=>v.due<=Date.now());if(!due.length)return sheet(`<h3>My words (${D.vocab.length})</h3><p class="mut">${D.vocab.length?'Nothing due right now.':'Save words from the lookup sheet to build your deck.'}</p>${D.vocab.slice(-8).map(v=>`<p><b>${esc(v.w)}</b> <span class="mut">${esc(v.en)}</span></p>`).join('')}<button data-a="shx">Close</button>`);
 rv=due[0];sheet(`<p class="mut">${due.length} due</p><h2 style="display:block">${esc(rv.art?rv.art+' ':'')}${esc(rv.w)}</h2><p class="mut">${esc(rv.ctx)}</p><div id="bk" hidden><p><b>${esc(rv.en)}</b></p><p>${esc(rv.de)}</p><div class="row"><button data-a="gr" data-q="1">Again</button><button data-a="gr" data-q="4">Good</button><button data-a="gr" data-q="5">Easy</button></div></div><button class="p" data-a="show">Show answer</button>`)}
function grade(q){const v=rv;if(q<3){v.n=0;v.iv=0;v.due=Date.now()+6e5}else{v.iv=v.n==0?1:v.n==1?3:Math.round(v.iv*v.ease);v.n++;v.ease=Math.max(1.3,v.ease+.1-(5-q)*(.08+(5-q)*.02));v.due=Date.now()+v.iv*864e5}save();review()}
/* ---------- settings ---------- */
let dirty=()=>JSON.stringify(draft)!==JSON.stringify(D.set);
function settings(){draft=draft||{...D.set};const d=draft,o=(k,vs)=>vs.map(v=>`<option ${d[k]==v?'selected':''}>${v}</option>`).join('');
 $('#app').innerHTML=`<h1>Settings</h1>
 <div class="card"><h3>Appearance</h3><label>Theme<select data-k="theme">${['auto','dark','amoled','sepia'].map(v=>`<option ${d.theme===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Accent<span class="row" style="margin:0">${['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899'].map(c=>`<button class="sw" data-a="ac" data-v="${c}" style="background:${c};${d.ac===c?'border-color:var(--fg)':''}"></button>`).join('')}</span></label><label>Caption size<input type="range" data-k="cap" data-n min="14" max="34" value="${d.cap}"></label><label>Transcript size<input type="range" data-k="lyr" data-n min="16" max="36" value="${d.lyr}"></label></div>
 <div class="card"><h3>Playback</h3><label>Default speed<input type="range" data-k="speed" data-n min="0.5" max="3" step="0.05" value="${d.speed}"></label><label>Skip buttons (seconds)<select data-k="skip" data-n>${o('skip',[5,10,15,30])}</select></label><label>Rewind on resume (seconds)<select data-k="rew" data-n>${o('rew',[0,2,5])}</select></label></div>
 <div class="card"><h3>Learning</h3><label>Your level<select data-k="lvl">${o('lvl',['A2','B1','B2','C1'])}</select></label><label>Pause when I tap a word<input type="checkbox" data-k="pause" ${d.pause?'checked':''}></label><label>Blur translations until tapped<input type="checkbox" data-k="peek" ${d.peek?'checked':''}></label><label>Default captions<select data-k="capm">${['de','en2','off'].map(v=>`<option value="${v}" ${d.capm===v?'selected':''}>${{de:'German',en2:'German + English',off:'Off'}[v]}</option>`).join('')}</select></label><button data-a="rev">Review my words (${D.vocab.length})</button></div>
 <div class="card"><h3>Stats</h3><p>🔥 ${stats().s}-day streak · ${stats().today} min today · ${D.vocab.length} words · ${D.vocab.filter(v=>v.due<=Date.now()).length} due</p></div>
 <div class="card"><h3>AI and word sources</h3><p class="mut">Keys stay on this device and are never exported. Inside Claude the built-in Claude is used. On your own hosted copy, add a key. With no AI, word lookup falls back to the Wiktionary dictionary (online).</p><label>First choice<select data-k="prim">${['gemini','openai','anthropic'].map(v=>`<option value="${v}" ${d.prim===v?'selected':''}>${PV[v]}</option>`).join('')}</select></label><label class="mut"><span>Switch to the next AI when one hits its limit</span><input type="checkbox" data-k="fb" ${d.fb!==false?'checked':''}></label>${['gemini','openai','anthropic'].map(p=>`<label class="mut" style="display:block">${PV[p]} key<input type="password" data-key="${p}" autocomplete="off" value="${esc((d.keys||{})[p]||'')}" style="width:100%;margin-top:4px"><input type="text" data-model="${p}" placeholder="Model (default ${DM[p]})" value="${esc((d.models||{})[p]||'')}" style="width:100%;margin-top:4px"></label>`).join('')}<p class="mut">An OpenAI key also enables Auto-transcribe in the transcript menu.</p><div class="row"><button data-a="exp">Backup / import</button><button data-a="wipe">Erase all data</button></div></div>
 <div class="stk"><button class="p" data-a="savest" id="svb" style="flex:1">Save changes</button><button data-a="revert">Revert</button></div>`;upd()}
function upd(){const b=$('#svb');if(b)b.style.opacity=dirty()?1:.5}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const w=e.target.closest('.w');if(w&&!$('#pl').hidden){return wtap(w)}
 const a=e.target.closest('[data-a]');if(!a){return}const x=a.dataset.a,id=a.dataset.id;
 const c=cur&&D.tr[cur.id]||[];
 if(x==='open')open(id);
 else if(x==='close'){pausedBy=false;closeSh();$('#pl').hidden=true;persist();mini();view()}
 else if(x==='expand')$('#pl').hidden=false,mini();
 else if(x==='pp')M.paused?M.play():M.pause();
 else if(x==='back')M.currentTime=Math.max(0,M.currentTime-D.set.skip);
 else if(x==='fwd')M.currentTime+=D.set.skip;
 else if(x==='ps'){const i=idx;if(i>=0)M.currentTime=(M.currentTime-c[i].s>2||i===0)?c[i].s:c[i-1].s}
 else if(x==='ns'){if(c[idx+1])M.currentTime=c[idx+1].s}
 else if(x==='seek'&&!cur.yt)M.currentTime=c[+a.dataset.i].s;
 else if(x==='loop'){loop=!loop;loopI=idx;a.classList.toggle('on',loop);if(loop&&idx<0)toast('Start playback first')}
 else if(x==='phr'){pm=!pm;anc=null;a.classList.toggle('on',pm);toast(pm?'Tap the first and last word of a phrase':'Phrase mode off')}
 else if(x==='capm'){D.set.capm=D.set.capm==='de'?'en2':D.set.capm==='en2'?'off':'de';save();a.textContent='CC: '+({de:'DE',en2:'DE+EN',off:'OFF'}[D.set.capm]);hl()}
 else if(x==='paste')sheet(`<h3>Transcript</h3><textarea id="ta" placeholder="Paste German text, SRT, VTT or LRC"></textarea><div class="row"><button class="p" data-a="tpaste">Use text</button><button data-a="tup">Upload file</button><button data-a="asr">Auto-transcribe</button><button data-a="tclr">Clear</button><button data-a="shx">Close</button></div>`);
 else if(x==='tpaste'){setTr($('#ta').value);closeSh()}
 else if(x==='tup')$('#ft').click();
 else if(x==='tclr'){delete D.tr[cur.id];delete D.tl[cur.id];save();idx=-1;rtx();closeSh()}
 else if(x==='drt'){dopen=!dopen;$('#drb').hidden=!dopen;a.textContent=dopen?'▼ English translation':'▲ English translation (hidden)';drw()}
 else if(x==='rv')a.classList.toggle('b');
 else if(x==='trall')trall();
 else if(x==='shx')closeSh();
 else if(x==='say')speak(a.dataset.t);
 else if(x==='sv'&&L){const r=L.r;if(!D.vocab.some(v=>v.w===(r.lemma||L.w))){D.vocab.push({w:r.lemma||L.w,art:r.article&&r.article!=='null'?r.article:'',en:(r.en||[]).slice(0,3).join(', '),de:r.def_de||r.de||'',ctx:L.ctx,ease:2.5,iv:0,n:0,due:Date.now()});save()}toast('Saved to My words')}
 else if(x==='fav'){D.fav[cur.id]=!D.fav[cur.id];save();pf()}
 else if(x==='favi'){D.fav[id]=!D.fav[id];save();view()}
 else if(x==='del'){D.lib=D.lib.filter(i=>i.id!==id);idbp('del',id);save();if(cur&&cur.id===id){M.pause();cur=null;mini()}view()}
 else if(x==='newpl'){const n=prompt&&prompt('Playlist name');if(n){D.pl[n]=D.pl[n]||[];save();view()}}
 else if(x==='addpl'){const ns=Object.keys(D.pl);sheet(`<h3>Add to playlist</h3>${ns.map(n=>`<button data-a="topl" data-n="${esc(n)}" style="margin:4px">${esc(n)}${D.pl[n].includes(cur.id)?' ✓':''}</button>`).join('')||'<p class="mut">No playlists yet. Create one in the library with “＋ Playlist”.</p>'}<div class="row"><button data-a="shx">Close</button></div>`)}
 else if(x==='topl'){const n=a.dataset.n;D.pl[n]=D.pl[n].includes(cur.id)?D.pl[n].filter(i=>i!==cur.id):[...D.pl[n],cur.id];save();closeSh();toast('Playlist updated')}
 else if(x==='addurl'){const u=$('#url').value.trim();if(!u)return;const k=TABS.find(t=>t[0]===tab)[4],m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/);const it={id:'u'+Date.now(),n:m?'YouTube '+m[1]:decodeURIComponent(u.split('?')[0].split('/').pop()||u),k,mode:'on'};if(m){if(k!=='v')return toast('YouTube works in Online Watch only');it.yt=m[1]}else it.url=u;D.lib.push(it);save();view()}
 else if(x==='demo'){demo(TABS.find(t=>t[0]===tab)[4])}
 else if(x==='ac'){draft.ac=a.dataset.v;apply(draft);settings()}
 else if(x==='savest'){if(!dirty())return toast('Nothing to save');D.set={...draft};save();apply();toast('Settings saved');icons();upd()}
 else if(x==='revert'){draft={...D.set};apply();settings()}
 else if(x==='lk')look(a.dataset.w,a.dataset.w,false);else if(x==='lvl')lvlSheet();else if(x==='exw')exw();else if(x==='quiz')quiz();else if(x==='qa'){a.style.background=a.dataset.ok==='1'?'#16a34a':'#dc2626';a.style.color='#fff'}
 else if(x==='dic')dic();else if(x==='dpl')dplay(0);else if(x==='dsl')dplay(1);else if(x==='dck')dcheck();else if(x==='dnx'){dki=Math.min(dki+1,D.tr[cur.id].length-1);dsheet()}
 else if(x==='shw')shadow();else if(x==='shp'){const q=D.tr[cur.id][shI];idx=-1;M.currentTime=q.s;dkEnd=q.e;M.play()}else if(x==='shr')shrec();else if(x==='shm'){const m=$('#mine');m&&m.src&&m.play()}else if(x==='shn'){shI=Math.min(shI+1,D.tr[cur.id].length-1);ssheet()}
 else if(x==='hid'){tw.classList.toggle('hid');a.classList.toggle('on')}
 else if(x==='kn'&&L){D.known=D.known||[];const w=(L.r.lemma||L.w).toLowerCase();if(!D.known.includes(w))D.known.push(w);save();toast('Marked as known')}
 else if(x==='asr')asr();
 else if(x==='cpy'){$('#bx').select();try{await navigator.clipboard.writeText($('#bx').value)}catch(e){document.execCommand('copy')}toast('Copied')}
 else if(x==='imp'){try{const j=JSON.parse($('#bi').value);D.vocab=[...D.vocab,...(j.vocab||[]).filter(v=>!D.vocab.some(x=>x.w===v.w))];Object.assign(D.fav,j.fav||{});Object.assign(D.pl,j.pl||{});Object.assign(D.tr,j.tr||{});Object.assign(D.tl,j.tl||{});D.known=[...new Set([...(D.known||[]),...(j.known||[])])];save();toast('Imported');closeSh()}catch(e){toast('Not a valid backup')}}
 else if(x==='rev')review();else if(x==='show'){$('#bk').hidden=false;a.remove()}else if(x==='gr')grade(+a.dataset.q);
 else if(x==='exp')sheet(`<h3>Backup and import</h3><p class="mut">Copy this text to keep or move your words, transcripts, playlists and settings. API keys and audio files are not included.</p><textarea id="bx" readonly>${esc(JSON.stringify({...D,lib:[],set:{...D.set,keys:{},models:{}}}))}</textarea><div class="row"><button data-a="cpy">Copy</button></div><textarea id="bi" placeholder="Paste a backup here"></textarea><div class="row"><button class="p" data-a="imp">Import (merge)</button><button data-a="shx">Close</button></div>`);
 else if(x==='wipe'){D={lib:[],pl:{},fav:{},pos:{},rate:{},tr:{},tl:{},vocab:[],set:{...DEF}};save();draft=null;apply();toast('All data erased');settings()}
});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='fa')addFiles([...t.files],TABS.find(x=>x[0]===tab)[4]);
 else if(t.id==='flt'){flt=t.value;view()}
 else if(t.id==='ft'&&t.files[0]){setTr(await rd(t.files[0]));t.value='';closeSh()}});

$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(tab==='st'&&b.dataset.t!=='st'&&draft&&dirty()){toast('Unsaved changes discarded');}draft=null;apply();tab=b.dataset.t;flt='all';view()});
apply();icons();view();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
